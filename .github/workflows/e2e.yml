name: E2E (qoʻlda)

# Brauzer sinovlari — deploy quvurida ISHLAMAYDI, chunki 10+ daqiqa oladi.
# Kerak boʻlganda: Actions → «E2E (qoʻlda)» → Run workflow.
# Odatda musobaqadan oldin yoki katta oʻzgarishdan keyin bir marta.
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Sekin sinovlar bilan (butun toʻr, guruh→pleyoff)"
        type: boolean
        default: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: musobaqa
          POSTGRES_USER: musobaqa_app
          POSTGRES_PASSWORD: ci_password
        options: >-
          --health-cmd "pg_isready -U musobaqa_app -d musobaqa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://musobaqa_app:ci_password@127.0.0.1:5432/musobaqa
      SESSION_SECRET: ci-only-secret-at-least-32-characters-long
      ADMIN_PASSWORD: ci_admin_password
      UPLOAD_DIR: ./uploads
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Baza
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          PGPASSWORD=ci_password psql -h 127.0.0.1 -U musobaqa_app -d musobaqa \
            -c "create extension if not exists pg_trgm;"
          npx tsx scripts/migrate.ts
          npx tsx scripts/seed.ts --force

      - name: Bazali mantiq sinovlari
        run: |
          npx tsx scripts/verify-numbering.ts
          node --import tsx --conditions=react-server scripts/verify-progression.ts

      - run: npm run build
      - run: npx tsc --noEmit

      - name: Playwright keshi
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Brauzer
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Sinovlar
        run: |
          npx tsx scripts/seed.ts --force
          npm run start:e2e:ci &
          for i in $(seq 1 45); do
            curl -sf -o /dev/null http://127.0.0.1:3100/ && break
            [ "$i" -eq 45 ] && { echo "server koʻtarilmadi"; exit 1; }
            sleep 2
          done
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            npx playwright test
          else
            npx playwright test --grep-invert "@slow"
          fi

      - name: Xato boʻlsa — izlar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
