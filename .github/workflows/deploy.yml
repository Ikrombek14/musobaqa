name: Deploy

# `main` ga push qilinganda sayt avtomatik yangilanadi.
on:
  push:
    branches: [main]
    # Hujjat oʻzgarsa butun quvurni yugurtirish shart emas
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      full_e2e:
        description: "Sekin sinovlarni ham oʻtkazish (toʻliq toʻr, guruh→pleyoff)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------
  # 1. Tekshiruv. Yiqilsa deploy BOʻLMAYDI.
  #
  # Odatiy push'da sekin sinovlar (butun toʻrni oxirigacha oʻynash,
  # 20 ta guruh oʻyini) oʻtkazilmaydi — ular quvurning yarim vaqtini
  # egallaydi. Ular har kecha va qoʻlda ishga tushirishda oʻtadi.
  # ------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: qara
          POSTGRES_USER: qara_app
          POSTGRES_PASSWORD: ci_password
        options: >-
          --health-cmd "pg_isready -U qara_app -d qara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://qara_app:ci_password@127.0.0.1:5432/qara
      SESSION_SECRET: ci-only-secret-at-least-32-characters-long
      ADMIN_PASSWORD: ci_admin_password
      UPLOAD_DIR: ./uploads
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Next build keshini saqlaymiz — qayta yigʻish ~2 barobar tez
      - name: Build keshi
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ hashFiles('package-lock.json') }}-
            next-

      - name: Jerebyovka va import mantiqi
        run: |
          npm run verify:draw
          npm run verify:import

      - name: Baza tayyorlanmoqda
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          PGPASSWORD=ci_password psql -h 127.0.0.1 -U qara_app -d qara -c "create extension if not exists pg_trgm;"
          npx tsx scripts/migrate.ts
          npx tsx scripts/seed.ts --force

      - name: Raqamlash va avtomatik turlar
        run: |
          npx tsx scripts/verify-numbering.ts
          node --import tsx --conditions=react-server scripts/verify-progression.ts

      # Build marshrut tiplarini (`PageProps`) generatsiya qiladi —
      # `tsc` undan KEYIN ishlashi kerak
      - run: npm run build

      - name: Tiplarni tekshirish
        run: npx tsc --noEmit

      # Brauzerlar keshda — har safar 100 MB yuklab olinmaydi
      - name: Playwright keshi
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Brauzer oʻrnatish
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Brauzer sinovlari
        run: |
          npx tsx scripts/seed.ts --force
          npm run start:e2e:ci &

          for i in $(seq 1 45); do
            curl -sf -o /dev/null http://127.0.0.1:3100/ && break
            [ "$i" -eq 45 ] && { echo "server koʻtarilmadi"; exit 1; }
            sleep 2
          done

          if [ "${{ github.event.inputs.full_e2e }}" = "true" ]; then
            echo "Toʻliq toʻplam"
            npx playwright test
          else
            echo "Tez toʻplam (sekin sinovlarsiz)"
            npx playwright test --grep-invert "@slow"
          fi

      - name: Xato boʻlsa — sinov izlari
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ------------------------------------------------------------
  # 2. Deploy.
  # ------------------------------------------------------------
  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: SSH kalitini tayyorlash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ⚠️ Skript ssh ga STDIN orqali berilmaydi: `docker compose run`
      # stdin'dan oʻqiydi va heredoc qoldigʻini yutib yuboradi —
      # keyingi buyruqlar bajarilmay qoladi, ssh esa 0 qaytaradi.
      # `-n` stdin'ni /dev/null ga bogʻlaydi.
      - name: Serverda yangilash
        run: |
          ssh -n -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -euo pipefail; \
             cd /opt/musobaqa; \
             git fetch --all --prune; \
             git reset --hard origin/main; \
             chmod +x scripts/*.sh; \
             bash scripts/ci-deploy.sh '${{ github.sha }}'"

      - name: Eski obrazlarni tozalash
        if: success()
        run: |
          ssh -n -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker image prune -f --filter 'until=168h' >/dev/null && echo tozalandi"
