name: Deploy

# `main` ga push → tekshiruv → deploy. Odatda ~2 daqiqa.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------
  # 1. Tez tekshiruv.
  #
  # Faqat serverga buzuq kod chiqmasligini kafolatlaydigan minimum:
  #   • build — TypeScript xatolarini ham tutadi
  #   • sof mantiq sinovlari — jerebyovka va Excel import
  #     (bazasiz, 2 soniya; ular haqiqiy xatolarni topgan:
  #      «shaxmat» → Sumo, notoʻgʻri bosqich nomlari)
  #
  # Brauzer sinovlari bu yerda ISHLAMAYDI — ular 10+ daqiqa oladi.
  # Kerak boʻlganda qoʻlda: `npm run e2e` yoki «E2E» workflow'i.
  # ------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      # Build paytida bazaga ulanilmaydi, lekin `lib/env.ts` qiymat talab qiladi
      DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
      SESSION_SECRET: ci-only-secret-at-least-32-characters-long
      ADMIN_PASSWORD: ci_admin_password
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build keshi
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - name: Mantiq sinovlari
        run: |
          npm run verify:draw
          npm run verify:import

      - run: npm run build

  # ------------------------------------------------------------
  # 2. Deploy.
  # ------------------------------------------------------------
  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: SSH kalitini tayyorlash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ⚠️ Skript ssh ga STDIN orqali berilmaydi: `docker compose run`
      # stdin'dan oʻqiydi va heredoc qoldigʻini yutib yuboradi.
      - name: Serverda yangilash
        run: |
          ssh -n -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -euo pipefail; \
             cd /opt/musobaqa; \
             git fetch --all --prune; \
             git reset --hard origin/main; \
             chmod +x scripts/*.sh; \
             bash scripts/ci-deploy.sh '${{ github.sha }}'"

      # Har deploy yangi qatlam qoldiradi. Obrazlar tozalanardi, BUILD
      # KESHI esa yoʻq — u 9 kunda 17 GB ga yetdi. Disk toʻlsa server
      # butunlay toʻxtaydi, shuning uchun u ham tozalanadi.
      - name: Eski obraz va build keshini tozalash
        if: success()
        run: |
          ssh -n -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker image prune -f --filter 'until=168h' >/dev/null; \
             docker builder prune -f --filter 'until=72h' >/dev/null; \
             echo \"tozalandi · boʻsh joy: \$(df -h / | awk 'NR==2{print \$4}')\""
