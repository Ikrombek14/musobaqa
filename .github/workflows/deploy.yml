name: Deploy

# `main` ga push qilinganda sayt avtomatik yangilanadi.
# Qoʻlda ham ishga tushirsa boʻladi (Actions → Deploy → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Ketma-ket deploy: ikkita push bir vaqtda serverga urilmasin
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------
  # 1. Tekshiruv. Yiqilsa deploy BOʻLMAYDI — buzuq kod serverga
  #    chiqmaydi.
  # ------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: qara
          POSTGRES_USER: qara_app
          POSTGRES_PASSWORD: ci_password
        options: >-
          --health-cmd "pg_isready -U qara_app -d qara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://qara_app:ci_password@127.0.0.1:5432/qara
      SESSION_SECRET: ci-only-secret-at-least-32-characters-long
      ADMIN_PASSWORD: ci_admin_password
      UPLOAD_DIR: ./uploads
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Jerebyovka mantiqi
        run: npm run verify:draw

      - name: Baza tayyorlanmoqda
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          PGPASSWORD=ci_password psql -h 127.0.0.1 -U qara_app -d qara -c "create extension if not exists pg_trgm;"
          npx tsx scripts/migrate.ts
          npx tsx scripts/seed.ts --force

      - name: Raqamlash va avtomatik turlar
        run: |
          npx tsx scripts/verify-numbering.ts
          node --import tsx --conditions=react-server scripts/verify-progression.ts

      # Build tiplarni ham tekshiradi VA marshrut tiplarini
      # (`PageProps`, `LayoutProps`) generatsiya qiladi — shuning uchun
      # alohida `tsc` undan KEYIN ishlashi kerak.
      - run: npm run build

      - name: Tiplarni tekshirish (sinov va skriptlar bilan birga)
        run: npx tsc --noEmit

      - name: Brauzer sinovlari (E2E)
        run: |
          npx playwright install --with-deps chromium
          npx tsx scripts/seed.ts --force

          # Muhit oʻzgaruvchilari job'dan keladi, `.env.local` kerak emas
          npm run start:e2e:ci &

          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://127.0.0.1:3100/; then
              echo "server tayyor"
              break
            fi
            [ "$i" -eq 45 ] && { echo "server koʻtarilmadi"; exit 1; }
            sleep 2
          done

          npm run e2e

      - name: Xato boʻlsa — sinov izlari
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ------------------------------------------------------------
  # 2. Deploy. Faqat tekshiruvdan oʻtgach.
  # ------------------------------------------------------------
  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: SSH kalitini tayyorlash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Serverda yangilash
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "GIT_SHA='${GIT_SHA}' bash -se" <<'REMOTE'
          set -euo pipefail
          cd /opt/musobaqa

          export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "▸ Kod yangilanmoqda"
          git fetch --all --prune
          git reset --hard origin/main

          echo "▸ Obraz yigʻilmoqda ($GIT_SHA)"
          docker compose build app

          # --build SHART: `docker compose run` mavjud obrazni qayta
          # ishlatadi, natijada yangi migratsiya eski obrazda boʻlmay
          # jimgina oʻtkazib yuboriladi.
          echo "▸ Migratsiyalar"
          docker compose run --rm --build tools npm run db:migrate:ci

          # --force-recreate SHART: obraz yangilangan boʻlsa ham
          # `up -d` konteynerni har doim ham qayta yaratmaydi. Busiz
          # deploy «muvaffaqiyatli» deb koʻrinib, eski kod ishlab
          # turaveradi.
          echo "▸ Ilova qayta ishga tushmoqda"
          docker compose up -d db backup
          docker compose up -d --force-recreate --no-deps app

          echo "▸ Holat tekshirilmoqda"
          for i in $(seq 1 30); do
            if docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null; then
              echo "✓ ilova javob bermoqda"
              break
            fi
            [ "$i" -eq 30 ] && { echo "✗ ilova koʻtarilmadi:"; docker compose logs --tail=50 app; exit 1; }
            sleep 2
          done

          # Eng muhim tekshiruv: serverda AYNAN push qilingan versiya
          # turibdimi? Bir marta konteyner qayta yaratilmay, eski kod
          # qolib ketgan va buni faqat qoʻlda tekshirganda topganmiz.
          echo "▸ Versiya tekshirilmoqda"
          RUNNING=$(docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/api/version').then(r=>r.json()).then(v=>console.log(v.sha))")
          echo "  kutilgan: $GIT_SHA"
          echo "  serverda: $RUNNING"
          if [ "$RUNNING" != "$GIT_SHA" ]; then
            echo "✗ ESKI VERSIYA ISHLAB TURIBDI — deploy amalda boʻlmadi"
            exit 1
          fi
          echo "✓ versiya mos"
          REMOTE

      - name: Eski obrazlarni tozalash
        if: success()
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker image prune -f --filter 'until=168h' >/dev/null && echo tozalandi"
